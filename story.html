<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於我們 — 月蝕工坊 Eclipse Atelier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #e2ded0;
            --text-muted: #a39b8b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 3秒輪轉背景圖層 */
        .hero-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .hero-slideshow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            animation: bgFade 6s infinite;
        }

        .hero-slideshow img:nth-child(1) { animation-delay: 0s; }
        .hero-slideshow img:nth-child(2) { animation-delay: 3s; }

        @keyframes bgFade {
            0% { opacity: 0; transform: scale(1.02); }
            12% { opacity: 0.55; }
            48% { opacity: 0.55; }
            60% { opacity: 0; transform: scale(1); }
            100% { opacity: 0; }
        }

        /* 暗色漸層遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 12, 0.7) 0%, rgba(10, 10, 12, 0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* 星光特效 */
        .sparkle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.5) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            opacity: 0.15;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.25; }
        }

        /* 導覽列 */
        header {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            background: transparent;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--gold-light);
            letter-spacing: 3px;
            text-decoration: none;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links li a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links li a:hover, .nav-links li a.active {
            color: var(--gold-primary);
        }

        /* 內容容器 */
        .content-container {
            position: relative;
            z-index: 3;
            max-width: 900px;
            margin: 4rem auto;
            padding: 3rem;
            background: rgba(15, 14, 14, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        p {
            font-size: 1.1rem;
            line-height: 2;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        .signature {
            text-align: right;
            margin-top: 3rem;
            font-style: italic;
            color: var(--gold-primary);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- 背景輪轉圖層 -->
    <div class="hero-slideshow">
        <img src="bar-interior.jfif" alt="微光吧台區">
        <img src="lounge-right.jfif" alt="星光祕境沙發區">
    </div>

    <div class="overlay"></div>
    <div class="sparkle-bg"></div>

    <header>
        <a href="index.html" class="logo">Eclipse Atelier</a>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="story.html" class="active">關於我們</a></li>
            <li><a href="bazaar.html">商隊品項</a></li>
            <li><a href="contact.html">星夜迴響</a></li>
        </ul>
    </header>

    <main class="content-container">
        <h1>關於我們・起源手札</h1>
        <p>在月色與暗影交織的深夜裡，「月蝕工坊（Eclipse Atelier）」悄然推開大門。這是一個結合 Dark Academia 暗黑美學、古樸神祕與微醺浪漫的避風港。我們遠離塵囂，專注於提供頂級的黑金料理、手工特色調酒，以及流動商隊帶來的奇幻選物。</p>
        <p>每一盞燭光、每一面古老星象圖、每一件精心挑選的選物，都承載著一段故事。在這裡，時間彷彿慢了下來，邀請您卸下白日的喧囂，一同沉浸在永恆的深夜迴響之中。</p>
        <div class="signature">— 月蝕工坊主理人 敬上</div>
    </main>

</body>
</html>
