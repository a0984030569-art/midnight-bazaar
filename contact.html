<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星夜迴響 — Eclipse Atelier 月蝕工坊</title>
    <!-- 引入古典襯線字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --bg-card: #121620;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #e2ded0;
            --text-muted: #a39b8b;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 背景閃亮星光特效 */
        .sparkle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.5) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 40px 40px;
            opacity: 0.15;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(1); }
            100% { opacity: 0.25; transform: scale(1.02); }
        }

        /* 頂部導覽列 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        header .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--gold-primary);
        }

        /* 聯繫表單區塊 */
        .contact-container {
            position: relative;
            z-index: 2;
            max-width: 750px;
            margin: 140px auto 60px auto;
            background-color: var(--bg-card);
            padding: 50px 40px;
            border-radius: 6px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        .contact-container h1 {
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 4px;
        }

        .contact-container p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 0.95rem;
            font-style: italic;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--gold-light);
            letter-spacing: 1.5px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: rgba(10, 10, 12, 0.8);
            font-size: 0.95rem;
            color: var(--text-main);
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .submit-btn {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            width: 100%;
            padding: 14px;
            background-color: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
            border-radius: 4px;
            font-size: 1.05rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .submit-btn:hover {
            background-color: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        #form-status {
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
            color: var(--gold-primary);
            letter-spacing: 1px;
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            nav ul { gap: 15px; }
            nav ul li a { font-size: 0.8rem; }
            .contact-container { margin: 100px 15px 40px 15px; padding: 30px 20px; }
            .contact-container h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- 背景閃亮星光特效 -->
    <div class="sparkle-bg"></div>

    <!-- 頂部導覽列 -->
    <header>
        <a href="index.html" class="logo">Eclipse Atelier</a>
        <nav>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="story.html">關於我們</a></li>
                <li><a href="bazaar.html">商隊品項</a></li>
                <li><a href="contact.html" style="color: var(--gold-primary);">星夜迴響</a></li>
            </ul>
        </nav>
    </header>

    <!-- 聯繫表單主體 -->
    <div class="contact-container">
        <h1>【 星夜迴響・祕密通訊 】</h1>
        <p class="subtitle">留下您的信箋與絮語，將透過信鴿悄悄送達月蝕工坊的管理員信箱！</p>
        
        <form id="ajax-form">
            <input type="hidden" name="_subject" value="【Eclipse Atelier 月蝕工坊】收到新的星夜信箋與委託！">
            <input type="hidden" name="_template" value="table">

            <div class="form-group">
                <label for="name">您的稱謂 / 旅人姓名</label>
                <input type="text" id="name" name="name" required placeholder="例如：林小姐">
            </div>

            <div class="form-group">
                <label for="email">您的電子信箱 / 回音信箋</label>
                <input type="email" id="email" name="email" required placeholder="your_email@example.com">
            </div>

            <div class="form-group">
                <label for="phone">聯絡電話</label>
                <input type="tel" id="phone" name="phone" required placeholder="例如：0912-345-678">
            </div>

            <div class="form-group">
                <label for="message">您的絮語或委託紀事</label>
                <textarea id="message" name="message" rows="5" required placeholder="請輸入您想預約的時間、想尋找的選物，或給月蝕工坊的靈魂絮語..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">【 釋出星夜信箋 】</button>
            <div id="form-status"></div>
        </form>
    </div>

    <footer>
        &copy; 2026 Eclipse Atelier 月蝕工坊 All Rights Reserved.
    </footer>

    <script>
        const form = document.getElementById('ajax-form');
        const statusDiv = document.getElementById('form-status');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            statusDiv.textContent = "✨ 正在透過星夜伺服器傳送信箋...";

            const formData = new FormData(form);

            fetch("https://formsubmit.co/ajax/a0984030569@gmail.com", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.textContent = "✨ 發送成功！信箋已確實送達月蝕工坊的信箱！";
                    form.reset();
                } else {
                    statusDiv.textContent = "❌ 發送失敗，請稍後再試。";
                }
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            })
            .catch(error => {
                statusDiv.textContent = "❌ 發生錯誤，請檢查網路連線。";
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            });
        });
    </script>

</body>
</html>
