<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們與訂位 | 星夜迴響 Midnight Bazaar</title>
    <!-- Google Fonts 溫潤圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;          /* 星夜迴響專屬深邃夜空黑 */
            --card-bg: #141b2d;          /* 質感深藍灰卡片底 */
            --accent-gold: #dfb15b;       /* 高級金黃色調 */
            --accent-hover: #f0c56e;
            --text-main: #f3f4f6;        /* 主要明亮文字 */
            --text-muted: #9ca3af;       /* 次要提示文字 */
            --border-color: #273046;     /* 精緻邊框色 */
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Zen Maru Gothic', 'PingFang TC', sans-serif; 
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header { 
            background-color: #111726; 
            color: var(--accent-gold); 
            padding: 3.5rem 1rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }
        
        header h1 { 
            font-size: 2.2rem; 
            margin-bottom: 8px; 
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            letter-spacing: 1px;
        }
        
        /* 導覽列：完美對齊首頁、故事、酒單與聯絡我們 */
        nav { 
            background-color: #111726; 
            border-bottom: 1px solid var(--border-color);
            padding: 15px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            width: 100%;
        }
        
        nav a { 
            color: var(--text-muted); 
            text-decoration: none; 
            margin: 0 18px; 
            font-weight: 500; 
            font-size: 1.05rem; 
            transition: color 0.3s;
        }
        
        nav a:hover, nav a.active { 
            color: var(--accent-gold); 
        }
        
        .container { 
            max-width: 800px; 
            width: 100%;
            margin: 45px auto; 
            padding: 0 20px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 45px; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6); 
            border: 1px solid var(--border-color);
        }

        h2 { 
            color: var(--accent-gold); 
            margin-bottom: 25px; 
            border-bottom: 2px solid var(--accent-gold); 
            padding-bottom: 10px; 
            text-align: center; 
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .notice-box {
            background-color: rgba(223, 177, 91, 0.08);
            border: 1px solid rgba(223, 177, 91, 0.25);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 30px;
            color: #e5d3a5;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        
        .form-group { 
            margin-bottom: 22px; 
        }

        label { 
            display: block; 
            font-weight: 500; 
            margin-bottom: 8px; 
            color: var(--text-main); 
        }

        input, textarea, select { 
            width: 100%; 
            padding: 14px 18px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 15px; 
            background-color: #0b0f19;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, textarea:focus, select:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 0 3px rgba(223, 177, 91, 0.15);
        }

        button { 
            width: 100%; 
            background-color: var(--accent-gold); 
            color: #0b0f19; 
            padding: 15px; 
            border: none; 
            border-radius: 30px; 
            font-size: 1rem; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.25);
            transition: background 0.3s, transform 0.2s;
            letter-spacing: 1px;
        }

        button:hover { 
            background-color: var(--accent-hover); 
            transform: translateY(-2px);
        }
        
        footer { 
            text-align: center; 
            padding: 35px 20px; 
            background-color: #111726; 
            color: var(--text-muted); 
            width: 100%; 
            border-top: 1px solid var(--border-color);
            font-size: 0.95rem;
            letter-spacing: 1px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌌 星夜迴響 Midnight Bazaar</h1>
        <p>深夜微醺與爵士樂的私密聚落｜線上訂位與專屬諮詢</p>
    </header>

    <!-- 導覽列：完美串聯首頁、關於我們(故事)、微醺酒單、聯絡我們 -->
    <nav>
        <a href="index.html">首頁</a>
        <a href="story.html">關於我們</a>
        <a href="menu.html">微醺酒單</a>
        <a href="contact.html" class="active">聯絡我們</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>✨ 質感訂位與私密諮詢</h2>

            <div class="notice-box">
                🍸 <strong>訂位須知：</strong>為維護深夜微醺空間品質，訂位保留 10 分鐘。若有包場需求或特殊慶生安排，請於下方備註告知，將由專人與您聯繫。
            </div>
            
            <!-- 使用確定能穩穩收到信的 Formspree 管道 -->
            <form action="https://formspree.io/f/maeebrwz" method="POST">
                <div class="form-group">
                    <label for="name">貴賓姓名 *</label>
                    <input type="text" id="name" name="貴賓姓名" required placeholder="例如：張先生 / Ms. Chang">
                </div>

                <div class="form-group">
                    <label for="phone">連絡電話 *</label>
                    <input type="tel" id="phone" name="連絡電話" required placeholder="例如：0912-345-678">
                </div>

                <div class="form-group">
                    <label for="email">電子信箱 *</label>
                    <input type="email" id="email" name="Email" required placeholder="例如：yourname@email.com">
                </div>

                <div class="form-group">
                    <label for="guests">預計訂位人數 *</label>
                    <select id="guests" name="訂位人數" required>
                        <option value="">請選擇人數</option>
                        <option value="1-2位 漫調雙人座">1 - 2 位（漫調雙人座）</option>
                        <option value="3-4位 微醺聚會桌">3 - 4 位（微醺聚會桌）</option>
                        <option value="5位以上 星夜包廂/長桌">5 位以上（星夜包廂 / 質感長桌）</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">希望蒞臨日期與時間 *</label>
                    <input type="datetime-local" id="date" name="蒞臨時間" required>
                </div>

                <div class="form-group">
                    <label for="message">備註需求（如：慶生佈置、過敏原、座位偏好等）</label>
                    <textarea id="message" name="備註需求" rows="4" placeholder="例如：當天有壽星，希望能協助準備小驚喜..."></textarea>
                </div>

                <button type="submit">確認送出訂位與諮詢 🍸</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Midnight Bazaar 星夜迴響. All Rights Reserved. 🌌</p>
    </footer>

</body>
</html>
