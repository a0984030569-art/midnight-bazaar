<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星夜迴響・聯絡我們 | 月蝕工坊 Eclipse Atelier</title>
    <!-- 引入古典襯線字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --bg-card: #171515;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #e2ded0;
            --text-muted: #a39b8b;
            --border-color: #332e29;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 3秒輪轉背景圖層 */
        .hero-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .hero-slideshow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            animation: bgFade 6s infinite;
        }

        .hero-slideshow img:nth-child(1) { animation-delay: 0s; }
        .hero-slideshow img:nth-child(2) { animation-delay: 3s; }

        @keyframes bgFade {
            0% { opacity: 0; transform: scale(1.02); }
            12% { opacity: 0.55; }
            48% { opacity: 0.55; }
            60% { opacity: 0; transform: scale(1); }
            100% { opacity: 0; }
        }

        /* 暗色漸層遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 12, 0.7) 0%, rgba(10, 10, 12, 0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* 閃亮星光背景特效 */
        .sparkle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.5) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            opacity: 0.15;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.25; }
        }

        /* 頂端導覽列 */
        nav {
            position: relative;
            z-index: 100;
            background-color: rgba(15, 14, 14, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        nav .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold-light);
            text-decoration: none;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--gold-primary);
        }

        nav ul li a.active {
            color: var(--gold-primary);
            font-weight: 700;
        }

        /* 聯絡表單主體 */
        .contact-container {
            position: relative;
            z-index: 3;
            max-width: 680px;
            margin: 50px auto;
            background-color: rgba(23, 21, 21, 0.9);
            padding: 40px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(5px);
        }

        .contact-container h1 {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: var(--gold-light);
            margin-bottom: 12px;
            font-size: 2.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .contact-container p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 1rem;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--gold-light);
            letter-spacing: 1px;
            font-size: 1rem;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 4px;
            background-color: rgba(10, 10, 12, 0.85);
            font-size: 1rem;
            color: var(--text-main);
            font-family: inherit;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            background-color: rgba(15, 14, 14, 0.95);
        }

        .submit-btn {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            width: 100%;
            padding: 14px;
            background-color: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
            border-radius: 4px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        /* 質感 Dark Academia 風格小彈窗 (Modal) 樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 9, 9, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background-color: var(--bg-card);
            border: 1px solid var(--gold-primary);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .modal-box p {
            color: var(--text-main);
            font-size: 1.05rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .modal-btn {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            background-color: var(--gold-primary);
            color: var(--bg-deep);
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background-color: var(--gold-light);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        footer {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
            background-color: rgba(10, 10, 12, 0.9);
        }
    </style>
</head>
<body>

    <!-- 3秒輪轉背景圖層 -->
    <div class="hero-slideshow">
        <img src="bar-interior.jfif" alt="微光吧台區">
        <img src="lounge-right.jfif" alt="星光祕境沙發區">
    </div>

    <div class="overlay"></div>
    <div class="sparkle-bg"></div>

    <!-- 導覽列 -->
    <nav>
        <a href="index.html" class="logo">Eclipse Atelier</a>
        <ul>
            <li><a href="index.html">首頁</a></li>
            <li><a href="story.html">關於我們</a></li>
            <li><a href="bazaar.html">商隊品項</a></li>
            <li><a href="contact.html" class="active">星夜迴響</a></li>
        </ul>
    </nav>

    <!-- 聯絡表單主體 -->
    <div class="contact-container">
        <h1>星夜迴響・聯絡我們</h1>
        <p class="subtitle">若您對深夜饗宴或商隊選物有任何疑問，或欲留下您的迴響，請填寫下方信箋。</p>
        
        <form id="ajax-form">
            <input type="hidden" name="_subject" value="【月蝕工坊】收到新的星夜迴響與聯絡訊息！">
            <input type="hidden" name="_template" value="table">

            <div class="form-group">
                <label for="name">您的稱謂 / 靈魂代號</label>
                <input type="text" id="name" name="name" required placeholder="例如：夜行者">
            </div>

            <div class="form-group">
                <label for="email">電子信箱</label>
                <input type="email" id="email" name="email" required placeholder="your.email@domain.com">
            </div>

            <div class="form-group">
                <label for="message">迴響內容</label>
                <textarea id="message" name="message" rows="5" required placeholder="寫下您的思緒與想說的話..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">傳遞深夜迴響</button>
        </form>
    </div>

    <!-- 成功送出後的 Dark Academia 風格小彈窗 (Modal) -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-box">
            <h3>✦ 傳遞成功 ✦</h3>
            <p>您的信箋已乘着微光與星空，<br>確實送達月蝕工坊管理員信箱。</p>
            <button class="modal-btn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <footer>
        &copy; 2026 月蝕工坊 Eclipse Atelier. All Rights Reserved. Dark Academia Web Design Project.
    </footer>

    <!-- FormSubmit AJAX 與 Modal 互動邏輯 -->
    <script>
        const form = document.getElementById('ajax-form');
        const submitBtn = document.getElementById('submit-btn');
        const modal = document.getElementById('successModal');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            submitBtn.textContent = "正在傳遞信箋...";

            const formData = new FormData(form);

            fetch("https://formsubmit.co/ajax/a0984030569@gmail.com", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 顯示精緻質感小彈窗
                    modal.style.display = 'flex';
                    form.reset();
                } else {
                    alert("發送失敗，請稍後再試。");
                }
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.textContent = "傳遞深夜迴響";
            })
            .catch(error => {
                alert("發生網路錯誤，請稍後再試。");
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.textContent = "傳遞深夜迴響";
            });
        });

        // 關閉彈窗函式
        function closeModal() {
            modal.style.display = 'none';
        }
    </script>

</body>
</html>
