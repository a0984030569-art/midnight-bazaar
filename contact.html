<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星夜迴響 — Eclipse Atelier 月蝕工坊</title>
    <!-- 引入古典襯線字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --bg-card: #121620;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #e2ded0;
            --text-muted: #a39b8b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 背景閃亮星光特效 */
        .sparkle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.5) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 40px 40px;
            opacity: 0.15;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(1); }
            100% { opacity: 0.25; transform: scale(1.02); }
        }

        /* 頂部導覽列 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--gold-primary);
        }

        /* 聯繫表單主容器 */
        .contact-container {
            position: relative;
            z-index: 2;
            max-width: 750px;
            margin: 140px auto 80px auto;
            padding: 50px 40px;
            background: rgba(18, 22, 32, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .contact-header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 20px;
        }

        .contact-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--gold-light);
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .contact-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 2px;
            font-style: italic;
        }

        /* 表單樣式 */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            color: var(--gold-light);
            margin-bottom: 8px;
            letter-spacing: 1.5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 18px;
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .form-group textarea {
            height: 150px;
            resize: vertical;
        }

        .submit-btn {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
            font-size: 1.05rem;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .submit-btn:hover {
            background-color: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        /* 頁尾 */
        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            nav ul { gap: 15px; }
            nav ul li a { font-size: 0.8rem; }
            .contact-container { margin: 100px 15px 40px 15px; padding: 30px 20px; }
            .contact-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- 背景閃亮粒子層 -->
    <div class="sparkle-bg"></div>

    <!-- 頂部導覽列 -->
    <header>
        <a href="index.html" class="logo">Eclipse Atelier</a>
        <nav>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="story.html">關於我們</a></li>
                <li><a href="bazaar.html">商隊品項</a></li>
                <li><a href="contact.html" style="color: var(--gold-primary);">信鴿傳書</a></li>
            </ul>
        </nav>
    </header>

    <!-- 聯繫表單主體 -->
    <div class="contact-container">
        <div class="contact-header">
            <h1>【 星夜迴響・祕密通訊 】</h1>
            <p>Send a Message to the Midnight Caravan</p>
        </div>
        
        <!-- 表單串接 (請將 action 內的網址替換為你實際可用的 Formspree 接收端點) -->
        <form action="https://formspree.io/f/你的表單代碼" method="POST">
            <div class="form-group">
                <label for="name">您的稱謂 / 旅人姓名</label>
                <input type="text" id="name" name="name" required placeholder="請輸入您的稱謂...">
            </div>
            
            <div class="form-group">
                <label for="email">您的電子信箱 / 回音信箋</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <label for="message">您的絮語 / 委託紀事</label>
                <textarea id="message" name="message" required placeholder="在此留下您給月蝕商隊的訊息或靈魂絮語..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">【 釋出星夜信箋 】</button>
        </form>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; 2026 Eclipse Atelier. All Rights Reserved.</p>
    </footer>

</body>
</html>
