<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星夜迴響 — 月蝕工坊 Eclipse Atelier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #e2ded0;
            --text-muted: #a39b8b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 3秒輪轉背景圖層 */
        .hero-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .hero-slideshow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            animation: bgFade 6s infinite;
        }

        .hero-slideshow img:nth-child(1) { animation-delay: 0s; }
        .hero-slideshow img:nth-child(2) { animation-delay: 3s; }

        @keyframes bgFade {
            0% { opacity: 0; transform: scale(1.02); }
            12% { opacity: 0.55; }
            48% { opacity: 0.55; }
            60% { opacity: 0; transform: scale(1); }
            100% { opacity: 0; }
        }

        /* 暗色漸層遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 12, 0.7) 0%, rgba(10, 10, 12, 0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* 星光特效 */
        .sparkle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.5) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            opacity: 0.15;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.25; }
        }

        /* 導覽列 */
        header {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            background: transparent;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--gold-light);
            letter-spacing: 3px;
            text-decoration: none;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links li a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links li a:hover, .nav-links li a.active {
            color: var(--gold-primary);
        }

        /* 內容容器與表單 */
        .content-container {
            position: relative;
            z-index: 3;
            max-width: 800px;
            margin: 3rem auto;
            padding: 3rem;
            background: rgba(15, 14, 14, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .contact-info {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--gold-light);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: rgba(10, 10, 12, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--text-main);
            font-family: inherit;
            border-radius: 2px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .submit-btn {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            display: block;
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
            font-size: 1rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 2rem;
            border-radius: 2px;
        }

        .submit-btn:hover {
            background-color: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <!-- 背景輪轉圖層 -->
    <div class="hero-slideshow">
        <img src="bar-interior.jfif" alt="微光吧台區">
        <img src="lounge-right.jfif" alt="星光祕境沙發區">
    </div>

    <div class="overlay"></div>
    <div class="sparkle-bg"></div>

    <header>
        <a href="index.html" class="logo">Eclipse Atelier</a>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="story.html">關於我們</a></li>
            <li><a href="bazaar.html">商隊品項</a></li>
            <li><a href="contact.html" class="active">星夜迴響</a></li>
        </ul>
    </header>

    <main class="content-container">
        <h1>星夜迴響・聯絡我們</h1>
        <p class="contact-info">若您對深夜饗宴或商隊選物有任何疑問，或欲留下您的迴響，請填寫下方信笺。</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">您的稱謂 / 靈魂代號</label>
                <input type="text" id="name" name="name" required placeholder="例如：夜行者">
            </div>
            <div class="form-group">
                <label for="email">電子信箱</label>
                <input type="email" id="email" name="email" required placeholder="your.email@domain.com">
            </div>
            <div class="form-group">
                <label for="message">迴響內容</label>
                <textarea id="message" name="message" rows="5" required placeholder="寫下您的思緒與想說的話..."></textarea>
            </div>
            <button type="submit" class="submit-btn">傳遞深夜迴響</button>
        </form>
    </main>

</body>
</html>
