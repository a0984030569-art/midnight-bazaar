<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Atelier — 月蝕工坊</title>
    <!-- 引入古典襯線字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #e2ded0;
            --text-muted: #a39b8b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Serif TC', 'Playfair Display', serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 背景閃亮星光特效 */
        .sparkle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.5) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 40px 40px;
            opacity: 0.15;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(1); }
            100% { opacity: 0.25; transform: scale(1.02); }
        }

        /* 頂部品牌標誌與導覽列 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            background: transparent;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--gold-light);
            letter-spacing: 3px;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links li a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links li a:hover {
            color: var(--gold-primary);
        }

        /* 首頁核心 Banner 區塊 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            color: var(--gold-light);
            margin-bottom: 20px;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .hero p {
            font-size: 1.3rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-style: italic;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 30px;
            margin-bottom: 40px;
        }

        /* 按鈕群組 */
        .btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .enter-btn {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            display: inline-block;
            padding: 14px 30px;
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
            font-size: 1rem;
            letter-spacing: 3px;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .enter-btn:hover {
            background-color: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            header { padding: 20px 30px; }
            .nav-links { display: none; }
            .hero h1 { font-size: 2.5rem; letter-spacing: 3px; }
            .hero p { font-size: 1rem; padding: 10px 15px; }
            .btn-group { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- 背景閃亮粒子層 -->
    <div class="sparkle-bg"></div>

    <!-- 頂部品牌標誌與導覽 -->
    <header>
        <a href="index.html" class="logo">Eclipse Atelier</a>
        <ul class="nav-links">
            <li><a href="story.html">關於我們</a></li>
            <li><a href="bazaar.html">商隊品項</a></li>
            <li><a href="contact.html">星夜迴響</a></li>
        </ul>
    </header>

    <!-- 首頁主要視覺 Banner -->
    <section class="hero">
        <h1>Eclipse Atelier</h1>
        <p>— 尋找深夜裡的一抹微光 —</p>
        <div class="btn-group">
            <a href="story.html" class="enter-btn">【 關於我們・起源手札 】</a>
            <a href="bazaar.html" class="enter-btn">【 進入深夜商隊 】</a>
        </div>
    </section>

</body>
</html>
