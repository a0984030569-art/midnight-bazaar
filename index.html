<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月蝕工坊 | 奇幻選物與深夜手作所</title>
    <!-- 引入古典襯線字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #14100E;         /* 深邃暗夜黑棕 */
            --bg-card: #1C1613;         /* 卡片暗皮革色 */
            --text-main: #EFE7DE;       /* 溫潤月光白 */
            --text-muted: #A39387;      /* 灰褐神祕次要字 */
            --accent-gold: #C5A059;     /* 復古古銅金 */
            --accent-glow: rgba(197, 160, 89, 0.15);
            --border-line: #3D3028;     /* 沉穩邊框線條 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif TC', 'Georgia', serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.9;
            letter-spacing: 0.8px;
            position: relative;
            overflow-x: hidden;
        }

        /* ================= 魔法星光背景 (一閃一閃特效) ================= */
        .stars-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1; /* 確保在最底層，不會影響上方按鈕點擊 */
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #C5A059, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 60px 90px, #EFE7DE, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 120px 50px, #C5A059, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 150px, #A39387, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 280px 100px, #C5A059, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 340px 220px, #EFE7DE, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 300px 300px;
            opacity: 0.5;
            animation: starTwinkle 4s ease-in-out infinite alternate;
        }

        @keyframes starTwinkle {
            0% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
            100% { opacity: 0.25; transform: scale(1); }
        }

        /* ================= Header: 沉浸式暗夜神祕主視覺 ================= */
        header {
            position: relative;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle at center, #261D18 0%, #14100E 70%);
            border-bottom: 2px solid var(--border-line);
            z-index: 2;
        }

        /* 雙層古典裝飾框線 */
        header::before {
            content: '';
            position: absolute;
            top: 20px; bottom: 20px; left: 20px; right: 20px;
            border: 1px solid rgba(197, 160, 89, 0.25);
            pointer-events: none;
        }
        header::after {
            content: '';
            position: absolute;
            top: 26px; bottom: 26px; left: 26px; right: 26px;
            border: 1px solid rgba(197, 160, 89, 0.1);
            pointer-events: none;
        }

        .moon-symbol {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.4);
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #F8F4EC;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
        }

        header p {
            font-size: 1.15rem;
            max-width: 650px;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
            position: relative;
            z-index: 2;
        }

        .header-badge {
            display: inline-block;
            padding: 8px 25px;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 0.9rem;
            letter-spacing: 2px;
            background: rgba(197, 160, 89, 0.05);
            box-shadow: inset 0 0 10px var(--accent-glow);
            position: relative;
            z-index: 2;
        }

        /* ================= 導航選單：古籍卷軸風 ================= */
        .nav-container {
            max-width: 1100px;
            margin: -50px auto 80px auto;
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .mystic-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 45px 35px;
            text-align: center;
            position: relative;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 卡片hover時金光浮現 */
        .mystic-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 40px rgba(197, 160, 89, 0.15);
        }

        .mystic-card::before {
            content: '✦';
            position: absolute;
            top: 15px;
            right: 15px;
            color: var(--accent-gold);
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .mystic-card h3 {
            font-size: 1.4rem;
            color: #F8F4EC;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .mystic-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .mystic-btn {
            display: inline-block;
            padding: 12px 32px;
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .mystic-btn:hover {
            background-color: var(--accent-gold);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--accent-glow);
        }
    </style>
</head>
<body>

    <!-- 背景一閃一閃的星光特效層 -->
    <div class="stars-background"></div>

    <!-- ================= 沉浸式主視覺 ================= -->
    <header>
        <div class="moon-symbol">☽ ── ☾</div>
        <h1>月蝕工坊</h1>
        <p>Eclipse Atelier — 當月影被陰影吞噬，古老的工藝與香氣便在暗夜中甦醒。這是一座專屬於深夜未歸靈魂的魔幻避難所。</p>
        <div class="header-badge">✦ 奇幻選物 ✕ 深夜手作 ✕ 異國香料 ✦</div>
    </header>

    <!-- ================= 神祕卷軸導航卡片 ================= -->
    <div class="nav-container">
        <!-- 區塊一 -->
        <div class="mystic-card">
            <div class="card-icon">🍞</div>
            <h3>深夜手作烘焙</h3>
            <p>遵循古法、低糖無負擔的歐式麵包與司康，揉入波斯玫瑰與錫蘭肉桂，在寂靜時刻溫暖心靈。</p>
            <a href="#bakery" class="mystic-btn">探索烘焙櫥窗</a>
        </div>
        <!-- 區塊二 -->
        <div class="mystic-card">
            <div class="card-icon">🏺</div>
            <h3>奇幻選物典藏</h3>
            <p>來自沙漠深處與神話傳說的器物——黃銅風鈴、捕夢網香氛、流光砂漏，收藏時間碎片。</p>
            <a href="#curios" class="mystic-btn">瀏覽奇幻選物</a>
        </div>
        <!-- 區塊三 -->
        <div class="mystic-card">
            <div class="card-icon">🍵</div>
            <h3>深夜香料特調</h3>
            <p>土耳其慢煮肉桂紅、摩洛哥薄荷綠茶、晨曦玫瑰露拿鐵，撫平一整天的喧囂與疲憊。</p>
            <a href="#drinks" class="mystic-btn">品嚐深夜暖意</a>
        </div>
    </div>

</body>
</html>
